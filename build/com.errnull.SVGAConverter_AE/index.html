<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html" charset="UTF-8">

    <link href="./src/css/bootstrap.min.css" rel="stylesheet">
    
    <script type="text/javascript" src="./src/helpers/CSInterface.js"></script>
    <script type="text/javascript" src="./src/helpers/CSInterfaceHelper.js"></script>
    <script src="./src/assets/jquery.min.js"></script>
    <script src="./src/actions/PageActions.js"></script>
    <script src="./src/assets/jszip.min.js"></script>
    <script src="./src/assets/jszip-utils.min.js"></script>
    <script src="./src/assets/svga.min.js"></script>
    <script type="text/javascript">
        loadJSX("compsManager.jsx");
    </script>

    <title>SVGAConverter</title>
</head>

<style>

    body{
        background-color: #474747;
    }

    .container{
        margin-left: 20px;
    }

    .clearfix{
        margin-top: 4%;
    }

    .col-md-4{
        float: left;
    }

    .col-md-5{
        float: left;
        position:relative;
        min-height:1px;
        padding-right:15px;
        padding-left:15px
    }

    .progressBarDiv{
        margin-top: 24px;
    }
    
    .dropDownItem{
        margin-left: 24px;
    }
    
    #startConvertBtn{
        float: left;
        width: 110px;

    }

    #dropDownBtn{
        float: left;
        height: 34px;
        margin-left: 1px;
    }

    #dropGroupDiv{
        
    }

    #selectFile{
        margin-left: 6px;
    }

    #dropDownMenu{
        text-align: left;
        left: 12 !important;
        width: 140px;
    }

    /* 右下角：安卓内存预估 */
    #memoryUsage{
        position: fixed;
        right: 10px;
        bottom: 8px;
        font-size: 12px;
        color: #cccccc;
        z-index: 10;
        text-align: right;
        pointer-events: auto;
    }

    /* 左下角：作者署名（可点击跳转仓库） */
    #authorSign{
        position: fixed;
        left: 10px;
        bottom: 8px;
        font-size: 12px;
        color: #cccccc;
        z-index: 10;
        letter-spacing: 0.3px;
        user-select: none;
        cursor: pointer;
        transition: color .15s ease;
    }
    #authorSign:hover{
        color: #ffffff;
        text-decoration: underline;
    }

</style>

<body>

<div class="container">

    <div class="row clearfix">

        <div class="col-md-4 column">
            <button type="button" class="btn btn-default btn-block btn-success" id="selectPathBtn" onclick="selectPath()">输出路径</button>
        </div>
        <div id="dropGroupDiv" class="col-md-5 btn-group">
            <button type="button" class="btn btn-default btn-block btn-success" id="startConvertBtn" disabled onclick="startConvert()">开始转换 - 2.0</button>
            <button data-toggle="dropdown" class="btn dropdown-toggle btn-success" id="dropDownBtn" disabled onclick="openMenu()"><span class="caret"></span></button>
            <ul id="dropDownMenu" class="dropdown-menu">
                <li>
                    <a class="dropDownItem" href="javascript:void(0)" onclick="changeToVersion('1.0')">SVGA - 1.0</a>
                </li>
                <li>
                    <a class="dropDownItem" href="javascript:void(0)" onclick="changeToVersion('1.5')">SVGA - 1.5</a>
                </li>
                <li>
                    <a class="dropDownItem" href="javascript:void(0)" onclick="changeToVersion('2.0')">SVGA - 2.0</a>
                </li>
            </ul>
        </div>

        <div class="col-md-4 column">
            <button type="button" class="btn btn-default btn-block btn-success" id="selectFile" onclick="selectFile()">选择播放文件</button>
        </div>

    </div>

    <div class="row clearfix">
        <div class="col-md-12 column">
            <div id="canvas" style="background-color: #333333; width: 400px; height: 400px"></div>
        </div>
    </div>
    <div class="box" id="box"></div>
    <div id="authorSign" title="点击打开 GitHub 仓库：github.com/jarryleo/SVGA-AEConverter" onclick="openAuthorRepo(event)">Jarry Leo · <span id="authorVersion">v1.2.0</span></div>
    <div id="memoryUsage">预估内存：-- MB</div>
</div>

<script type="text/javascript">
    document.onclick=function(e){
        if (e.target.id != "dropDownBtn"){
            document.getElementById("dropGroupDiv").className = "col-md-5 btn-group";
        }
    }

    // 左下角署名：点击打开 GitHub 仓库
    var AUTHOR_REPO_URL = "https://github.com/jarryleo/SVGA-AEConverter";
    function openAuthorRepo(e) {
        if (e && e.stopPropagation) { e.stopPropagation(); }
        try {
            if (typeof csInterface !== 'undefined' && csInterface.openURLInDefaultBrowser) {
                csInterface.openURLInDefaultBrowser(AUTHOR_REPO_URL);
                return;
            }
        } catch (err) { }
        try { window.open(AUTHOR_REPO_URL, '_blank'); } catch (err2) { }
    }

    function alertMessages(message) {
        csInterface.evalScript("alertMessage('" + message + "');");
    }

    function confirmMessages(message, callbackTrue, callbackFalse) {
        csInterface.evalScript("confirmMessage('" + message + "');", function (result) {

            if (result == 'true'){
                callbackTrue();

            }else{
                callbackFalse();
            }
        });
    }

    function downloadFile(uri,filename,callback){
        //request 不可用或网络失败时不能阻断面板初始化
        if (typeof request !== 'function') {
            callback();
            return;
        }
        var finished = false;
        var finish = function () {
            if (finished) { return; }
            finished = true;
            callback();
        };
        try {
            var stream = fs.createWriteStream(filename);
            stream.on('error', finish);
            stream.on('close', finish);
            var req = request(uri);
            req.on('error', function () {
                try { stream.end(); } catch (e) { }
                finish();
            });
            req.pipe(stream);
        } catch (e) {
            finish();
        }
    }

    //自动更新检查：仅比较版本，有新版本时打开 Releases 页面，由用户下载对应平台安装包覆盖安装
    try {
        var infoUrl = 'https://raw.githubusercontent.com/jarryleo/SVGA-AEConverter/master/updateInfo';
        var infoName = nodePath.join(csInterface.getSystemPath(SystemPath.MY_DOCUMENTS), '.updateInfo');
        var currentInfoFile = nodePath.join(csInterface.getSystemPath(SystemPath.EXTENSION), 'updateInfo');

        downloadFile(infoUrl, infoName, function () {
            try {
                if (!fs.existsSync(infoName)) {
                    return;
                }
                var newestText = String(fs.readFileSync(infoName, 'utf-8') || '').trim();
                try { fs.unlinkSync(infoName); } catch (e) { }

                if (!/^v\d+/.test(newestText)) {
                    //远端没有合法 updateInfo（例如仓库尚未发布）时跳过检查
                    return;
                }
                var newestVersion = parseInt(newestText.replace(/^v/, ''));
                var currentVersion = parseInt(String(fs.readFileSync(currentInfoFile, 'utf-8') || '').replace(/^v/, ''));
                if (isNaN(newestVersion) || isNaN(currentVersion) || currentVersion >= newestVersion) {
                    return;
                }

                confirmMessages("检测到新版本 " + newestText + "，是否打开下载页面？ \\n tip: 下载过慢可以稍后再试。", function () {
                    csInterface.openURLInDefaultBrowser("https://github.com/jarryleo/SVGA-AEConverter/releases");
                }, function () {
                });
            } catch (e) {
                console.log('update check skipped: ' + e.message);
            }
        });
    } catch (e) {
        console.log('update check failed: ' + e.message);
    }
    parser = new SVGA.Parser();

    //loading.svga 随扩展发布，必须从扩展目录取（原来取的是 AE 安装目录，必然找不到）
    var loadingName = csInterface.getSystemPath(SystemPath.EXTENSION) + "/src/res/loading.svga";

    if (fs.existsSync(loadingName)) {
        parser.load(loadingName, function (videoItem) {

            player = new Svga.Player('#canvas');

            player.setVideoItem(videoItem);
            player.startAnimation()
        });
    }

    /// 右键菜单。
    csInterface.setContextMenu(
        '<Menu>' +
        '<MenuItem Id="playMovie" Label="Play" Enabled="true" Checked="false" />' +
        '<MenuItem Id="stopMovie" Label="Stop" Enabled="true" Checked="false" />' +
        '</Menu>',

        function( menu ) {
            switch( menu ) {
                case "playMovie"  : player.startAnimation(); break;
                case "stopMovie"  : player.pauseAnimation(); break;

                default: break;
            }
        });
</script>

</body>
</html>
